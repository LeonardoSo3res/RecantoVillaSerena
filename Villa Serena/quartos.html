<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quartos - Villa Serena</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            RECANTO VILLA SERENA
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               href="index.html">
                Início
            </a>

            <a class="nav-link"
               href="quartos.html">
                Quartos
            </a>

            <a class="nav-link"
               href="reserva.html">
                Reserva
            </a>

            <a class="nav-link"
               href="dados.html">
                Dados
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h6>Quartos disponíveis</h6>
    <div class="row g-4">       

        <div class="col-md-4">
            <div class="card quarto">
                <img src="img/pexels-misbaa-eri-426041722-35103140.jpg" alt="Standard">
                <div class="card-body">
                    <h5>Quarto Standard</h5>

                    <p>
                        1 cama • 2 hóspedes
                    </p>

                    <h5>
                        R$ 220/noite
                    </h5>

                    <a id="btnStandard" class="btn btn-primary w-100">
                        Escolher quarto
                    </a>

                </div>
            </div>
        </div>
        
        <div class="col-md-4">

            <div class="card quarto">
                <img src="img/pexels-alan-antony-279974862-18470966.jpg" alt="Deluxe">
                <div class="card-body">

                    <h5>Quarto Deluxe</h5>

                    <p>
                        2 camas • 2 hóspedes
                    </p>

                    <h5>
                        R$ 320/noite
                    </h5>

                    <a id="btnDeluxe" class="btn btn-primary w-100">
                        Escolher quarto
                    </a>


                </div>
            </div>
        </div>       

        <div class="col-md-4">
            <div class="card quarto">
                <img src="img/pexels-misbaa-eri-426041722-36916382.jpg" alt="Premium">
                <div class="card-body">
                    <h5>Suíte Premium</h5>

                    <p>
                        4 hóspedes • suíte
                    </p>

                    <h5>
                        R$ 450/noite
                    </h5>

                    <a id="btnPremium" class="btn btn-primary w-100">
                        Escolher quarto
                    </a>


                </div>
            </div>
        </div>
    </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);

const checkin = params.get("checkin");
const checkout = params.get("checkout");
const hospedes = params.get("hospedes");

document.getElementById("btnStandard").href =
    `reserva.html?quarto=standard&checkin=${checkin}&checkout=${checkout}&hospedes=${hospedes}`;

document.getElementById("btnDeluxe").href =
    `reserva.html?quarto=deluxe&checkin=${checkin}&checkout=${checkout}&hospedes=${hospedes}`;

document.getElementById("btnPremium").href =
    `reserva.html?quarto=premium&checkin=${checkin}&checkout=${checkout}&hospedes=${hospedes}`;
</script>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script>
    new window.VLibras.Widget(
        "https://vlibras.gov.br/app"
    );
</script>

</body>
</html>
