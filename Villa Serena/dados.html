<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Dados - Villa Serena</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css"

    
</head>

<body>
<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            RECANTO VILLA SERENA
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               href="index.html">
                Início
            </a>

            <a class="nav-link"
               href="quartos.html">
                Quartos
            </a>

            <a class="nav-link"
               href="reserva.html">
                Reserva
            </a>

            <a class="nav-link"
               href="dados.html">
                Dados
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <h6>Dados do hóspede</h6>

    <div class="card p-4">

        <div class="row">

            <div class="col-md-7">

    <h5 class="mb-3">Dados do hóspede</h5>

    <label class="form-label"></label>
    <input type="text" class="form-control mb-3" placeholder="Digite seu nome completo"
           required>

    <label class="form-label"></label>
    <input type="email" class="form-control mb-3" placeholder="Digite seu e-mail"
           required>

    <label class="form-label"></label>
    <input type="tel" class="form-control mb-3" placeholder="Digite seu telefone"
           required>


    <h5 class="mt-4 mb-3">Forma de pagamento</h5>

    <div class="form-check mb-2">
        <input class="form-check-input"
               type="radio"
               name="pagamento"
               id="pix"
               required>

        <label class="form-check-label" for="pix">
            Pix
        </label>
    </div>

    <div class="form-check mb-2">
        <input class="form-check-input"
               type="radio"
               name="pagamento"
               id="cartao">

        <label class="form-check-label" for="cartao">
            Cartão de crédito
        </label>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input"
               type="radio"
               name="pagamento"
               id="local">

        <label class="form-check-label" for="local">
            Pagamento no local
        </label>
    </div>


    <button type="button"
        class="btn btn-primary"
        onclick="confirmarReserva()">
        Confirmar reserva
    </button>


</div>


      <div class="col-md-5">

        <img id="imagemQuarto"
         class="imagem-reserva rounded"
         src=""
         alt="Quarto escolhido">
        </div>

        </div>

    </div>

</div>
<script>

const params = new URLSearchParams(window.location.search);

const quarto = params.get("quarto");

const imagens = {
    standard: "img/pexels-misbaa-eri-426041722-35103156.jpg",
    deluxe: "img/pexels-alan-antony-279974862-18470955.jpg",
    premium: "img/pexels-misbaa-eri-426041722-36916378.jpg"
};

document.getElementById("imagemQuarto").src =
    imagens[quarto];

</script>
<script>

function confirmarReserva() {

    const nome = document.querySelector(
        'input[placeholder="Digite seu nome completo"]'
    ).value;

    const email = document.querySelector(
        'input[placeholder="Digite seu e-mail"]'
    ).value;

    const telefone = document.querySelector(
        'input[placeholder="Digite seu telefone"]'
    ).value;

    const pagamento = document.querySelector(
        'input[name="pagamento"]:checked'
    );

    if (!nome || !email || !telefone || !pagamento) {
        alert("Preencha todos os dados e escolha a forma de pagamento.");
        return;
    }

    const params = new URLSearchParams(window.location.search);

    const quarto = params.get("quarto");
    const checkin = params.get("checkin");
    const checkout = params.get("checkout");
    const hospedes = params.get("hospedes");

    window.location.href =
        `confirmacao.html?quarto=${quarto}&checkin=${checkin}&checkout=${checkout}&hospedes=${hospedes}&nome=${encodeURIComponent(nome)}&email=${encodeURIComponent(email)}&telefone=${encodeURIComponent(telefone)}&pagamento=${pagamento.id}`;

}

</script>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script>
    new window.VLibras.Widget(
        "https://vlibras.gov.br/app"
    );
</script>

</body>
</html>
