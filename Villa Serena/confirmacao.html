<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head> <body> <nav class="navbar navbar-expand-lg"> <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
        RECANTO VILLA SERENA
    </a>

    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="quartos.html">Quartos</a>
        <a class="nav-link" href="reserva.html">Reserva</a>
        <a class="nav-link" href="dados.html">Dados</a>
    </div>

</div>

</nav> <div class="container py-5">
<div class="card p-4">

    <div class="text-center mb-4">
        <h2>✓ Reserva confirmada!</h2>

        <p>Obrigado por escolher o Recanto Villa Serena.</p>

        <h6>
            Número da reserva:
            <span id="numero"></span>
        </h6>
    </div>


    <div class="row">

        <div class="col-md-7">

            <h5>Comprovante da reserva</h5>
            <hr>

            <p><b>Hóspede:</b> <span id="nome"></span></p>
            <p><b>E-mail:</b> <span id="email"></span></p>
            <p><b>Telefone:</b> <span id="telefone"></span></p>

            <hr>

            <p><b>Quarto:</b> <span id="quarto"></span></p>
            <p><b>Check-in:</b> <span id="checkin"></span></p>
            <p><b>Check-out:</b> <span id="checkout"></span></p>
            <p><b>Hóspedes:</b> <span id="hospedes"></span></p>
            <p><b>Pagamento:</b> <span id="pagamento"></span></p>

            <hr>

            <h4>Total: <span id="total"></span></h4>

        </div>


        <div class="col-md-5">

            <img id="imagem"
                 class="img-fluid rounded"
                 alt="Quarto reservado">

        </div>

    </div>


    <div class="text-center mt-4">

        <a href="index.html" class="btn btn-primary">
            Voltar para o início
        </a>

    </div>

</div>

</div> 
<script> const p = new URLSearchParams(location.search); const quarto = p.get("quarto"); const checkin = p.get("checkin"); const checkout = p.get("checkout"); const quartos = { standard: ["Quarto Standard", 220, "img/pexels-misbaa-eri-426041722-35103140.jpg"], deluxe: ["Quarto Deluxe", 320, "img/pexels-alan-antony-279974862-18470966.jpg"], premium: ["Suíte Premium", 450, "img/pexels-misbaa-eri-426041722-36916382.jpg"] }; const pagamentos = { pix: "Pix", cartao: "Cartão de crédito", local: "Pagamento no local" }; const q = quartos[quarto]; function data(d) { const [a, m, dia] = d.split("-"); return `${dia}/${m}/${a}`; } const dias = ( new Date(checkout) - new Date(checkin) ) / (1000 * 60 * 60 * 24); document.getElementById("nome").textContent = p.get("nome"); document.getElementById("email").textContent = p.get("email"); document.getElementById("telefone").textContent = p.get("telefone"); document.getElementById("quarto").textContent = q[0]; document.getElementById("checkin").textContent = data(checkin); document.getElementById("checkout").textContent = data(checkout); document.getElementById("hospedes").textContent = p.get("hospedes") + " hóspedes"; document.getElementById("pagamento").textContent = pagamentos[p.get("pagamento")]; document.getElementById("total").textContent = "R$ " + q[1] * dias; document.getElementById("imagem").src = q[2]; document.getElementById("numero").textContent = "VS-" + Math.floor(100000 + Math.random() * 900000); 

</script>

<div vw class="enabled">
