<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Reserva - Villa Serena</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            RECANTO VILLA SERENA
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               href="index.html">
                Início
            </a>

            <a class="nav-link"
               href="quartos.html">
                Quartos
            </a>

            <a class="nav-link"
               href="reserva.html">
                Reserva
            </a>

            <a class="nav-link"
               href="dados.html">
                Dados
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <h6>Detalhes da reserva</h6>

    <div class="card p-4">

        <div class="row align-items-center">

            <div class="col-md-6">

                <h4 id="nomeQuarto">Quarto</h4>


                <p id="datas"></p>
                <p id="hospedes"></p>
                
                <ul id="beneficios"></ul>            

                <h5 id="total"></h5>

                <a id="btnContinuar" class="btn btn-primary">
                    Continuar
                </a>


            </div>

            <div class="col-md-6">

             <img id="imagemQuarto" class="imagem-reserva" src="" alt="Quarto">

            </div>


        </div>

    </div>

</div>
<script>
const params = new URLSearchParams(window.location.search);

const quarto = params.get("quarto");
const checkin = params.get("checkin");
const checkout = params.get("checkout");
const hospedes = params.get("hospedes");

const nomes = {
    standard: "Quarto Standard",
    deluxe: "Quarto Deluxe",
    premium: "Suíte Premium"
};
const descricoes = {
    standard: "Uma opção confortável e prática para sua estadia.",
    deluxe: "Mais espaço e conforto para aproveitar sua hospedagem.",
    premium: "Uma experiência diferenciada, com mais espaço, privacidade e comodidades exclusivas."
};

const precos = {
    standard: 220,
    deluxe: 320,
    premium: 450
};

const imagens = {
    standard: "img/pexels-misbaa-eri-426041722-35103156.jpg",
    deluxe: "img/pexels-alan-antony-279974862-18470955.jpg",
    premium: "img/pexels-misbaa-eri-426041722-36916378.jpg"
};

document.getElementById("nomeQuarto").textContent =
    nomes[quarto];

function formatarData(data) {
    const [ano, mes, dia] = data.split("-");
    return `${dia}/${mes}/${ano}`;
}

document.getElementById("datas").textContent =
    `${formatarData(checkin)} → ${formatarData(checkout)}`;

document.getElementById("hospedes").textContent =
    `${hospedes} hóspedes`;
const beneficios = {
    standard: [
        "Café da manhã incluso",
        "Wi-Fi gratuito",
        "TV digital"
    ],

    deluxe: [
        "Café da manhã incluso",
        "Wi-Fi gratuito",
        "Ar-condicionado",
        "TV digital",
        "Varanda privativa"
    ],

    premium: [
        "Café da manhã incluso",
        "Wi-Fi gratuito",
        "Ar-condicionado",
        "TV digital",
        "Varanda privativa",
        "Banheira de hidromassagem",
        "Vista privilegiada"
    ]
};

document.getElementById("beneficios").innerHTML =
    beneficios[quarto]
        .map(item => `<li>${item}</li>`)
        .join("");

document.getElementById("imagemQuarto").src =
    imagens[quarto];

document.getElementById("imagemQuarto").alt =
    nomes[quarto];

const entrada = new Date(checkin);
const saida = new Date(checkout);

const dias = Math.round(
    (saida - entrada) / (1000 * 60 * 60 * 24)
);

const total = precos[quarto] * dias;

document.getElementById("total").textContent =
    `Total: R$ ${total}`;

document.getElementById("btnContinuar").href =
    `dados.html?quarto=${quarto}&checkin=${checkin}&checkout=${checkout}&hospedes=${hospedes}`;

</script>

<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script>
    new window.VLibras.Widget(
        "https://vlibras.gov.br/app"
    );
</script>

</body>
</html>
